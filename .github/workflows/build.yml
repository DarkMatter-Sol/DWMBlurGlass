name: Build DWMBlurGlass

"on":
  workflow_dispatch:
  push:
    branches: [master]
    paths-ignore: ["**.md"]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Inspect submodules
        shell: pwsh
        run: |
          git submodule status
          Write-Host "--- Root directories ---"
          Get-ChildItem -Directory | Select-Object Name
          Write-Host "--- Searching for Mui.h and Mui folder ---"
          Get-ChildItem -Recurse -Directory -Filter "Mui" -ErrorAction SilentlyContinue | Select-Object FullName
          Get-ChildItem -Recurse -Filter "Mui.h" -ErrorAction SilentlyContinue | Select-Object FullName

      - name: Force submodule sync
        shell: pwsh
        run: |
          git submodule sync --recursive
          git submodule update --init --recursive --force

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2

      - name: Restore NuGet packages
        run: nuget restore DWMBlurGlass.sln -NonInteractive

      - name: Build Release x64
        run: >
          msbuild DWMBlurGlass.sln
          /m
          /p:Configuration=Release
          /p:Platform=x64
          /p:PreferredToolArchitecture=x64

      - name: List output (debug helper)
        shell: pwsh
        run: |
          Get-ChildItem -Recurse -Include *.dll,*.exe,*.sys -Path . |
            Where-Object { $_.FullName -notmatch 'packages|\.git' } |
            Select-Object FullName

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: DWMBlurGlass-x64-Release
          path: |
            Build/x64/Release/**
            Languagefiles/**
          if-no-files-found: error
