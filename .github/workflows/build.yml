name: Build DWMBlurGlass

"on":
  workflow_dispatch:
  push:
    branches: [master]
    paths-ignore:
      - "**.md"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure
        run: cmake -B Build -G "Visual Studio 17 2022" -A x64
        shell: pwsh

      - name: Build
        run: cmake --build Build --config Release --parallel
        shell: pwsh

      - name: List build output (debug helper)
        shell: pwsh
        run: |
          Get-ChildItem -Recurse -Path Build -Include *.dll,*.exe,*.sys |
            Select-Object FullName

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: DWMBlurGlass-x64-Release
          path: |
            Build/Release/**
            Languagefiles/**
          if-no-files-found: error
