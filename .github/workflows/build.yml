name: Build DWMBlurGlass

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths-ignore: ["**.md"]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2

      - name: Restore NuGet packages
        run: nuget restore DWMBlurGlass.sln -NonInteractive

      - name: Build Release x64
        run: >
          msbuild DWMBlurGlass.sln
          /m
          /p:Configuration=Release
          /p:Platform=x64
          /p:RestorePackages=false
          /p:PreferredToolArchitecture=x64
          /p:AdditionalOptions="/utf-8"

      - name: List output (debug helper)
        run: Get-ChildItem -Recurse Build | Select-Object FullName
        shell: pwsh

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: DWMBlurGlass-x64-Release
          path: |
            Build/x64/Release/**
            Languagefiles/**
          if-no-files-found: error
