name: Build DWMBlurGlass

"on":
  workflow_dispatch:
  push:
    branches: [master]
    paths-ignore: ["**.md"]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Force submodule sync
        shell: pwsh
        run: |
          git submodule sync --recursive
          git submodule update --init --recursive --force

      - name: Report what we have (debug helper)
        shell: pwsh
        run: |
          Write-Host "=== git submodule status ==="
          git submodule status
          Write-Host "=== Root directories ==="
          Get-ChildItem -Directory | Select-Object Name
          Write-Host "=== All CMakeLists.txt locations ==="
          Get-ChildItem -Recurse -Filter CMakeLists.txt -ErrorAction SilentlyContinue | Select-Object FullName
          Write-Host "=== All .sln locations ==="
          Get-ChildItem -Recurse -Filter *.sln -ErrorAction SilentlyContinue | Select-Object FullName
          Write-Host "=== Mui.h search ==="
          Get-ChildItem -Recurse -Filter Mui.h -ErrorAction SilentlyContinue | Select-Object FullName

      - name: Configure and Build (auto-detect)
        shell: pwsh
        run: |
          $cmakeLists = Get-ChildItem -Recurse -Filter CMakeLists.txt -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -notmatch '\\tools\\|\\examples\\|\.git' } |
            Select-Object -First 1

          if ($cmakeLists) {
            $srcDir = $cmakeLists.DirectoryName
            Write-Host "Found CMakeLists.txt at: $srcDir"
            Write-Host "=== Configuring with CMake ==="
            cmake -B Build -S $srcDir -G "Visual Studio 17 2022" -A x64
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            Write-Host "=== Building with CMake ==="
            cmake --build Build --config Release --parallel
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          else {
            $sln = Get-ChildItem -Recurse -Filter *.sln | Select-Object -First 1
            if (-not $sln) { Write-Error "No CMakeLists.txt and no .sln found anywhere" }
            Write-Host "Found solution at: $($sln.FullName)"
            Write-Host "=== Restoring NuGet packages ==="
            nuget restore $sln.FullName -NonInteractive
            Write-Host "=== Building with MSBuild ==="
            msbuild $sln.FullName /m /p:Configuration=Release /p:Platform=x64 /p:PreferredToolArchitecture=x64
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: List output (debug helper)
        shell: pwsh
        run: |
          Get-ChildItem -Recurse -Include *.dll,*.exe,*.sys -Path . |
            Where-Object { $_.FullName -notmatch 'packages|\.git' } |
            Select-Object FullName

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: DWMBlurGlass-x64-Release
          path: |
            Build/**
            Languagefiles/**
          if-no-files-found: error
